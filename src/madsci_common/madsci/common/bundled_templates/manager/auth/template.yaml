name: "Auth Manager"
version: "1.0.0"
description: "Auth Manager (port 8007) deployment scaffolding — settings.yaml, .env, and operator notes"
category: "manager"
tags: ["auth", "manager", "security"]
skills: ["madsci-managers"]

author: "MADSci Team"
license: "MIT"
min_madsci_version: "0.8.0"
schema_version: "1.0"

target_model: "madsci.common.types.auth_types:AuthManagerSettings"

parameters:
  - name: lab_id
    type: string
    description: "lab_id (ULID) the Auth Manager binds to (Decision 12)"
    required: true
  - name: server_host
    type: string
    description: "Hostname this Auth Manager binds to"
    required: false
    default: "localhost"
  - name: server_port
    type: integer
    description: "Port — default 8007 (reserved)"
    required: false
    default: 8007
    min: 1024
    max: 65535
  - name: database_url
    type: string
    description: "PostgreSQL URL"
    required: false
    default: "postgresql://madsci:madsci@localhost/madsci_auth"
